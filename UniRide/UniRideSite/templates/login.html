{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniRide — Login</title>
<link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="app nonav">
<main class="login">
<header><div class="logo-box"><img src="{% static 'img/logo.png' %}" alt="UniRide — carona universitária"></div><p>Conectando estudantes universitários</p></header>
<form class="sheet" method="post" action="{% url 'login' %}">
{% csrf_token %}
<div class="tabs"><a class="on" href="{% url 'login' %}">Entrar</a><a href="{% url 'criar-conta' %}">Criar conta</a></div>
<label class="label" for="e">E-mail institucional</label><input id="e" name="email" type="email" placeholder="bernardo@puc-rio.br" required>
<label class="label" for="s">Senha</label><input id="s" name="senha" type="password" placeholder="••••••••" required>
{% if erro %}<p class="forgot" style="color:#dc2626">{{ erro }}</p>{% endif %}
<button class="btn" type="submit">Entrar</button>
<p class="forgot">Esqueceu sua senha? <a href="{% url 'recuperar-senha' %}">Recuperar</a></p>
<p class="forgot"><a href="{% url 'termos' %}">Termos de Uso</a></p>
</form></main>
</div>

</body>
</html>
