
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniRide — Meu trajeto</title>
    <link rel="stylesheet" href="{% static 'css/cadastrar-trajeto.css' %}">
</head>
<body>
<div class="app nonav">
    <div class="topbar">
        <a class="back" href="{% url 'home' %}">←</a>
        <h1>Meu trajeto</h1>
    </div>

    <form class="form" method="POST" action="{% url 'cadastrar-trajeto' %}">
        {% csrf_token %}

        <p class="label">Você quer</p>
        <div class="modes">
            <input type="radio" name="tipo" value="PROCURA" id="seek" hidden>
            <label for="seek" class="mode">🙋 Procurar carona</label>

            <input type="radio" name="tipo" value="OFERECE" id="offer" hidden checked>
            <label for="offer" class="mode">🚗 Oferecer carona</label>
        </div>

        <p class="label">Origem</p>
        <div class="field">
            <span>📍</span>
            <input type="text" name="origem" value="Botafogo" required>
        </div>

        <p class="label">Destino</p>
        <div class="field">
            <span>🎓</span>
            <input type="text" name="destino" value="PUC-Rio" required>
        </div>

        <p class="label">Dias da semana</p>
        <div class="days">
            <input type="checkbox" name="dias" value="dom" id="d0" hidden>
            <label for="d0" class="day">Dom</label>

            <input type="checkbox" name="dias" value="seg" id="d1" hidden checked>
            <label for="d1" class="day">Seg</label>

            <input type="checkbox" name="dias" value="ter" id="d2" hidden checked>
            <label for="d2" class="day">Ter</label>

            <input type="checkbox" name="dias" value="qua" id="d3" hidden checked>
            <label for="d3" class="day">Qua</label>

            <input type="checkbox" name="dias" value="qui" id="d4" hidden checked>
            <label for="d4" class="day">Qui</label>

            <input type="checkbox" name="dias" value="sex" id="d5" hidden checked>
            <label for="d5" class="day">Sex</label>

            <input type="checkbox" name="dias" value="sab" id="d6" hidden>
            <label for="d6" class="day">Sáb</label>
        </div>

        <p class="label">Horário de saída</p>
        <div class="field">
            <span>🕐</span>
            <input type="time" name="horario" value="07:20" required>
        </div>

        <p class="label seatsl">Vagas disponíveis</p>
        <div class="seats">
            <input type="radio" name="vagas" value="1" id="v1">
            <label for="v1" class="seat">1</label>

            <input type="radio" name="vagas" value="2" id="v2" checked>
            <label for="v2" class="seat">2</label>

            <input type="radio" name="vagas" value="3" id="v3">
            <label for="v3" class="seat">3</label>

            <input type="radio" name="vagas" value="4" id="v4">
            <label for="v4" class="seat">4</label>
        </div>

        <button type="submit" class="btn">Salvar trajeto</button>
    </form>
</div>

</body>
</html>
